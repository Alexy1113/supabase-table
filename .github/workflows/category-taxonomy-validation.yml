name: Website category taxonomy validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "tests/test_category_registry.py"
      - ".github/workflows/category-taxonomy-validation.yml"
  push:
    branches:
      - feature/peetri-pizza-category
    paths:
      - "app.py"
      - "requirements.txt"
      - "tests/test_category_registry.py"
      - ".github/workflows/category-taxonomy-validation.yml"

jobs:
  category-taxonomy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install website dependencies and shared taxonomy package
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile website and taxonomy tests
        run: python -m compileall -q app.py tests/test_category_registry.py

      - name: Run shared taxonomy integration tests
        run: python -m unittest discover -s tests -p "test_category_registry.py" -v
